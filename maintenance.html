<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - Gottlich Hardware</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .maintenance-container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            animation: fadeIn 0.8s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        
        p {
            font-size: 1.2em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .message {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
        }
        
        .contact {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e9ecef;
        }
        
        .contact p {
            font-size: 1em;
            color: #888;
        }
        
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            .maintenance-container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon">🔧</div>
        <h1>Under Maintenance</h1>
        
        <div class="message">
            <p><strong>We're currently performing scheduled maintenance</strong></p>
            <p>Our website is temporarily unavailable while we make some improvements to serve you better.</p>
        </div>
        
        <p>We'll be back online shortly. Thank you for your patience!</p>
        
        <div class="contact">
            <p>For urgent inquiries, please contact us:</p>
            <p>Email: <a href="mailto:info@gottlichhardware.com">info@gottlichhardware.com</a></p>
        </div>
    </div>
</body>
</html>
